<title>Mis Ingresos</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: una columna estrecha, resumen arriba, formulario de registro, desglose por categoría y lista de movimientos */
:root{
  --bg:#f3f5f2; --surface:#ffffff; --fg:#17211c; --muted:#5f6d65; --line:#dde3dd;
  --accent:#0f7a52; --accent-fg:#ffffff; --accent-soft:#e1f2ea; --danger:#b3372d;
  --c1:#0f7a52; --c2:#2f6fa8; --c3:#b7791f; --c4:#7a5bb0; --c5:#c4543f; --c6:#4a8c8c;
  --font-body:'Inter',system-ui,sans-serif; --font-display:'Space Grotesk','Inter',system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1713; --surface:#17211c; --fg:#e8efea; --muted:#93a39a; --line:#27342d;
  --accent:#3fc790; --accent-fg:#06231a; --accent-soft:#1a3329; --danger:#ef8277;
  --c1:#3fc790; --c2:#6aa9e0; --c3:#e0a94d; --c4:#a98ce0; --c5:#e88a76; --c6:#6fc2c2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0f1713; --surface:#17211c; --fg:#e8efea; --muted:#93a39a; --line:#27342d;
  --accent:#3fc790; --accent-fg:#06231a; --accent-soft:#1a3329; --danger:#ef8277;
  --c1:#3fc790; --c2:#6aa9e0; --c3:#e0a94d; --c4:#a98ce0; --c5:#e88a76; --c6:#6fc2c2; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--font-body);
  padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
h1,h2{font-family:var(--font-display);margin:0;text-wrap:balance}
h1{font-size:1.5rem}
h2{font-size:.78rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:500}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
select,input,button{font:inherit;color:inherit}
.cur{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.month{display:flex;align-items:center;justify-content:space-between;gap:8px}
.month button{background:none;border:1px solid var(--line);border-radius:8px;width:36px;height:36px;cursor:pointer}
.month .label{font-weight:600;text-transform:capitalize;flex:1;text-align:center}
.all{font-size:.85rem;border:1px solid var(--line);background:none;border-radius:8px;padding:6px 10px;cursor:pointer}
.all[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent)}
.total{font-family:var(--font-display);font-size:2.6rem;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.sub{color:var(--muted);font-size:.9rem}
label{font-size:.85rem;color:var(--muted);display:block;margin-bottom:6px}
.amount{display:flex;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg)}
.amount span{font-family:var(--font-display);font-size:1.4rem;color:var(--muted)}
.amount input{border:0;background:none;font-family:var(--font-display);font-size:1.6rem;font-weight:700;width:100%;padding:10px 0;outline:none;font-variant-numeric:tabular-nums}
.amount:focus-within,.field:focus{border-color:var(--accent);outline:2px solid var(--accent-soft)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 14px;cursor:pointer;font-size:.9rem}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field{width:100%;border:1px solid var(--line);border-radius:10px;background:var(--bg);padding:10px 12px;min-width:0}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:13px;font-weight:600;cursor:pointer;font-size:1rem}
.primary:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,select:focus-visible,.field:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.err{color:var(--danger);font-size:.85rem;min-height:1.2em}
.bars{display:flex;flex-direction:column;gap:12px}
.bar .head{display:flex;justify-content:space-between;gap:8px;font-size:.9rem;margin-bottom:4px}
.bar .head b{font-variant-numeric:tabular-nums;font-weight:600}
.track{height:8px;background:var(--bg);border-radius:4px;overflow:hidden}
.fill{height:100%;border-radius:4px}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.item{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.info{flex:1;min-width:0}
.info .cat{font-weight:500}
.info .meta{color:var(--muted);font-size:.82rem;overflow-wrap:anywhere}
.amt{font-family:var(--font-display);font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.del{background:none;border:0;color:var(--muted);cursor:pointer;font-size:1.2rem;padding:4px 8px;border-radius:6px}
.del:hover{color:var(--danger)}
.empty{color:var(--muted);text-align:center;padding:12px 0}
.note{font-size:.8rem;color:var(--muted)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(16px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;display:flex;gap:12px;align-items:center;font-size:.9rem}
.toast button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
.newcat{display:flex;gap:8px}
@media (max-width:420px){.total{font-size:2.1rem}}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .3s}}
</style>

<div class="wrap">
  <div class="top">
    <h1>Mis Ingresos</h1>
    <select id="cur" class="cur" aria-label="Moneda">
      <option value="$">$ Dólar / Peso</option>
      <option value="S/">S/ Sol</option>
      <option value="€">€ Euro</option>
    </select>
  </div>

  <section class="panel" aria-label="Resumen">
    <div class="month">
      <button id="prev" aria-label="Mes anterior">‹</button>
      <div class="label" id="monthLabel"></div>
      <button id="next" aria-label="Mes siguiente">›</button>
      <button class="all" id="all" aria-pressed="false">Todo</button>
    </div>
    <div>
      <div class="sub">Total de ingresos</div>
      <div class="total" id="total">0.00</div>
      <div class="sub" id="count"></div>
    </div>
  </section>

  <form class="panel" id="form" autocomplete="off">
    <h2>Registrar ingreso</h2>
    <div>
      <label for="amount">Monto</label>
      <div class="amount"><span id="sym">$</span><input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00"></div>
    </div>
    <div>
      <label>Categoría</label>
      <div class="chips" id="chips"></div>
    </div>
    <div class="row2">
      <div><label for="date">Fecha</label><input id="date" class="field" type="date"></div>
      <div><label for="note">Nota (opcional)</label><input id="note" class="field" type="text" maxlength="80" placeholder="Ej. Pago de marzo"></div>
    </div>
    <div class="err" id="err" role="alert"></div>
    <button class="primary" id="save" type="submit">Guardar ingreso</button>
    <div class="note" id="storeNote"></div>
  </form>

  <section class="panel" aria-label="Por categoría">
    <h2>Por categoría</h2>
    <div class="bars" id="bars"></div>
  </section>

  <section class="panel" aria-label="Movimientos">
    <h2>Movimientos</h2>
    <ul class="list" id="list"></ul>
  </section>
</div>
<div id="toastHost"></div>

<script>
const DEFAULT_CATS=['Sueldo','Freelance','Ventas','Inversiones','Regalo','Otros'];
const $=id=>document.getElementById(id);
let entries=[], store=null, view={month:null,all:false}, selectedCat=DEFAULT_CATS[0], extraCats=[], symbol='$';
const lsGet=(k,d)=>{try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}};
const lsSet=(k,v)=>{try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};

const today=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
view.month=today().slice(0,7);
const fmt=n=>symbol+' '+n.toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});
const monthName=m=>{const [y,mo]=m.split('-');return new Date(+y,+mo-1,1).toLocaleDateString('es',{month:'long',year:'numeric'})};
const shiftMonth=(m,d)=>{const [y,mo]=m.split('-').map(Number);const t=new Date(y,mo-1+d,1);return t.getFullYear()+'-'+String(t.getMonth()+1).padStart(2,'0')};
const colorFor=cat=>{const all=allCats();return 'var(--c'+((all.indexOf(cat)%6)+1)+')'};
const allCats=()=>{const s=[...DEFAULT_CATS];[...extraCats,...entries.map(e=>e.category)].forEach(c=>{if(c&&!s.includes(c))s.push(c)});return s};

/* Storage: db privado por persona; si no existe, localStorage */
async function initStore(){
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    const uid=user&&await user.id();
    if(db&&uid){
      const col=db.collection('data/users/'+uid);
      store={mode:'db',
        add:async e=>{await col.doc(e.id).set(e)},
        remove:async id=>{await col.doc(id).delete()},
        listen:cb=>col.onSnapshot(s=>cb(s.docs.map(d=>({id:d.id,...d.data()}))),()=>{})};
      $('storeNote').textContent='Tus datos se guardan de forma privada en tu cuenta.';
      return;
    }
  }catch(e){}
  store={mode:'local',
    add:async e=>{entries=[...entries,e];lsSet('ingresos',entries);render()},
    remove:async id=>{entries=entries.filter(x=>x.id!==id);lsSet('ingresos',entries);render()},
    listen:cb=>{cb(lsGet('ingresos',[]))}};
  $('storeNote').textContent='Tus datos se guardan solo en este navegador.';
}

function renderChips(){
  const box=$('chips');box.textContent='';
  allCats().forEach(c=>{
    const b=document.createElement('button');b.type='button';b.className='chip';b.textContent=c;
    b.setAttribute('aria-pressed',String(c===selectedCat));
    b.onclick=()=>{selectedCat=c;renderChips()};box.appendChild(b);
  });
  const add=document.createElement('button');add.type='button';add.className='chip';add.textContent='+ Nueva';
  add.onclick=()=>{
    box.textContent='';
    const w=document.createElement('div');w.className='newcat';
    const i=document.createElement('input');i.className='field';i.maxLength=24;i.placeholder='Nombre de categoría';i.id='newcatInput';
    const ok=document.createElement('button');ok.type='button';ok.className='chip';ok.textContent='Agregar';
    const commit=()=>{const v=i.value.trim();if(v){if(!allCats().includes(v))extraCats.push(v);selectedCat=v}renderChips()};
    ok.onclick=commit;i.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();commit()}};
    w.append(i,ok);box.appendChild(w);i.focus();
  };
  box.appendChild(add);
}

function render(){
  $('sym').textContent=symbol;
  const shown=view.all?entries:entries.filter(e=>e.date.slice(0,7)===view.month);
  $('monthLabel').textContent=view.all?'Todos los meses':monthName(view.month);
  $('all').setAttribute('aria-pressed',String(view.all));
  $('prev').disabled=$('next').disabled=view.all;
  const total=shown.reduce((s,e)=>s+e.amount,0);
  $('total').textContent=fmt(total);
  $('count').textContent=shown.length+(shown.length===1?' ingreso registrado':' ingresos registrados');

  const by={};shown.forEach(e=>by[e.category]=(by[e.category]||0)+e.amount);
  const rows=Object.entries(by).sort((a,b)=>b[1]-a[1]);
  const bars=$('bars');bars.textContent='';
  if(!rows.length){const d=document.createElement('div');d.className='empty';d.textContent='Cuando registres ingresos, verás aquí cuánto viene de cada categoría.';bars.appendChild(d)}
  rows.forEach(([c,v])=>{
    const pct=total?Math.round(v/total*100):0;
    const el=document.createElement('div');el.className='bar';
    const h=document.createElement('div');h.className='head';
    const n=document.createElement('span');n.textContent=c+' · '+pct+'%';
    const b=document.createElement('b');b.textContent=fmt(v);h.append(n,b);
    const t=document.createElement('div');t.className='track';
    const f=document.createElement('div');f.className='fill';f.style.width=pct+'%';f.style.background=colorFor(c);
    t.appendChild(f);el.append(h,t);bars.appendChild(el);
  });

  const list=$('list');list.textContent='';
  if(!shown.length){const li=document.createElement('li');li.className='empty';li.textContent='Aún no hay ingresos '+(view.all?'registrados.':'en este mes.')+' Escribe un monto, elige una categoría y guarda.';list.appendChild(li)}
  [...shown].sort((a,b)=>b.date.localeCompare(a.date)||(b.createdAt||0)-(a.createdAt||0)).forEach(e=>{
    const li=document.createElement('li');li.className='item';
    const dot=document.createElement('span');dot.className='dot';dot.style.background=colorFor(e.category);
    const info=document.createElement('div');info.className='info';
    const c=document.createElement('div');c.className='cat';c.textContent=e.category;
    const m=document.createElement('div');m.className='meta';
    const [y,mo,d]=e.date.split('-').map(Number);
    m.textContent=new Date(y,mo-1,d).toLocaleDateString('es',{day:'numeric',month:'short',year:'numeric'})+(e.note?' · '+e.note:'');
    info.append(c,m);
    const a=document.createElement('div');a.className='amt';a.textContent='+'+fmt(e.amount);
    const x=document.createElement('button');x.className='del';x.setAttribute('aria-label','Eliminar ingreso');x.textContent='×';
    x.onclick=()=>removeEntry(e);
    li.append(dot,info,a,x);list.appendChild(li);
  });
  renderChips_ifNeeded();
}
let lastCats='';
function renderChips_ifNeeded(){const k=allCats().join('|')+selectedCat;if(k!==lastCats&&!document.getElementById('newcatInput')){lastCats=k;renderChips()}}

let toastTimer;
function toast(msg,undo){
  const host=$('toastHost');host.textContent='';
  const t=document.createElement('div');t.className='toast';
  const s=document.createElement('span');s.textContent=msg;t.appendChild(s);
  if(undo){const b=document.createElement('button');b.textContent='Deshacer';b.onclick=()=>{undo();host.textContent=''};t.appendChild(b)}
  host.appendChild(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>host.textContent='',5000);
}
async function removeEntry(e){
  try{await store.remove(e.id);toast('Ingreso eliminado',()=>store.add(e))}catch(err){toast('No se pudo eliminar')}
}

$('form').addEventListener('submit',async ev=>{
  ev.preventDefault();
  const amount=parseFloat($('amount').value);
  const err=$('err');err.textContent='';
  if(!(amount>0)){err.textContent='Escribe un monto mayor a 0.';$('amount').focus();return}
  if(!$('date').value){err.textContent='Elige una fecha.';return}
  const e={id:'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6),amount:Math.round(amount*100)/100,category:selectedCat,date:$('date').value,note:$('note').value.trim(),createdAt:Date.now()};
  $('save').disabled=true;
  try{
    await store.add(e);
    $('amount').value='';$('note').value='';$('amount').focus();
    view.month=e.date.slice(0,7);
    toast('Ingreso guardado: '+fmt(e.amount)+' en '+e.category);
    render();
  }catch(x){err.textContent='No se pudo guardar. Intenta de nuevo.'}
  $('save').disabled=false;
});
$('prev').onclick=()=>{view.month=shiftMonth(view.month,-1);render()};
$('next').onclick=()=>{view.month=shiftMonth(view.month,1);render()};
$('all').onclick=()=>{view.all=!view.all;render()};
$('cur').onchange=e=>{symbol=e.target.value;lsSet('ingresos-moneda',symbol);render()};

symbol=lsGet('ingresos-moneda','$');$('cur').value=symbol;
$('date').value=today();
renderChips();render();
initStore().then(()=>{store.listen(list=>{entries=list.filter(e=>e&&typeof e.amount==='number'&&e.date);render()})});
</script>
